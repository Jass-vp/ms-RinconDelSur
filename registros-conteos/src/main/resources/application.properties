spring.application.name=registros-conteos
server.port=8082

spring.datasource.url=jdbc:mysql://localhost:3306/rincondelsur_usuario?createDatabaseIfNotExist=true&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

server.error.include-message=always

roles.service.url=http://localhost:8081
server.forward-headers-strategy=framework
