spring.application.name=usuario
server.port=8084
server.address=0.0.0.0

spring.datasource.url=jdbc:mysql://localhost:3306/rinconsur_usuario?createDatabaseIfNotExist=true&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

server.error.include-message=always
springdoc.swagger-ui.path=/swagger-ui.html
notificaciones.url=http://localhost:8085
roles.service.url=http://localhost:8083
server.forward-headers-strategy=framework
app.avatares.carpeta=uploads/avatares

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true