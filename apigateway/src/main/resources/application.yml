server:
  port: 8080

spring:
  application:
    name: apigateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: accesos-service
              uri: lb://ACCESOS
              predicates:
                - Path=/api/accesos/**
            - id: conteos-service
              uri: lb://CONTEOS
              predicates:
                - Path=/api/conteos/**
            - id: roles-service
              uri: lb://ROLES
              predicates:
                - Path=/api/roles/**
            - id: usuario-service
              uri: lb://USUARIO
              predicates:
                - Path=/api/usuarios/**, /api/usuario/**, /api/solicitudes-correo/**
            - id: notificaciones-service
              uri: lb://NOTIFICACIONES
              predicates:
                - Path=/api/notificaciones/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always